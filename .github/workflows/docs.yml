name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install github:cachix/devenv/v1.11.2

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            .devenv
            /nix/store
          key: ${{ runner.os }}-devenv-${{ hashFiles('**/devenv.lock') }}

      - name: Build and validate website
        shell: devenv shell bash -- -e {0}
        run: make website-release-candidate

      - name: Upload Hugo release candidate
        uses: actions/upload-artifact@v4
        with:
          name: mergeway-website-release-candidate-${{ github.sha }}
          path: mergeway-website-release-candidate.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install github:cachix/devenv/v1.11.2

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            .devenv
            /nix/store
          key: ${{ runner.os }}-devenv-${{ hashFiles('**/devenv.lock') }}

      - name: Build documentation
        shell: devenv shell bash -- -e {0}
        run: |
          export VERSION=$(
            docker run --pull=always ghcr.io/mergewayhq/mergeway-cli version \
            | sed -n 's/.*version: \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p'
          )
          mdbook build docs

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/book
          force_orphan: true
