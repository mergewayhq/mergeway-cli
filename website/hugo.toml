baseURL = 'https://mergewayhq.github.io/'
title = 'Mergeway'
description = 'Documentation for the Mergeway file-based database specification and tool suite.'
defaultContentLanguage = 'en'
disableKinds = ['taxonomy', 'term']

[build]
  noJSConfigInAssets = true

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'

[params]
  BookSection = 'docs'
  BookToC = true
  BookBreadcrumbs = true
  BookSearch = true
  BookComments = false
  BookRepo = 'https://github.com/mergewayhq/mergeway-cli'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/website/{{ .Path }}'
  BookFavicon = 'favicon.svg'

[[menu.before]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menu.after]]
  name = 'GitHub'
  url = 'https://github.com/mergewayhq/mergeway-cli'
  weight = 10

[[menu.after]]
  name = 'Releases'
  url = 'https://github.com/mergewayhq/mergeway-cli/releases'
  weight = 20

[[menu.after]]
  name = 'Contributing'
  url = 'https://github.com/mergewayhq/mergeway-cli/blob/main/DEVELOPING.md'
  weight = 30

[[menu.after]]
  name = 'MIT License'
  url = 'https://github.com/mergewayhq/mergeway-cli/blob/main/LICENSE.md'
  weight = 40
