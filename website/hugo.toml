baseURL = 'https://mergewayhq.github.io/'
title = 'Mergeway'
defaultContentLanguage = 'en'
disableKinds = ['taxonomy', 'term']

[build]
  noJSConfigInAssets = true

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'

[params]
  BookSection = 'docs'
  BookToC = true
  BookBreadcrumbs = true
  BookComments = false
